# Pingo OS: imagem do cartão SD (MBR)
#   0-8K     tabela MBR
#   8K       SPL + U-Boot (u-boot-sunxi-with-spl.bin), fora da tabela
#   16M      p1 PINGOBOOT (FAT32): kernel, device trees, extlinux.conf
#   80M      p2 sistema (squashfs, somente leitura)
#   (resto)  p3 ROMS (exFAT) criada no primeiro boot (Fase 1)

image boot.vfat {
	vfat {
		label = "PINGOBOOT"
		files = {
			"Image",
			"extlinux",
			"dtbs",
			"pingo-wifi.txt"
		}
	}
	size = 64M
}

image pingo-os-rg35xxh.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x50494e47
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		offset = 16M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}
}
