# Pingo OS by Retrogamer Brasil - RG35XX-H
# Unidades com o painel "rev6" (fabricadas a partir de 2025): troque a linha fdt por
#   fdt /dtbs/sun50i-h700-anbernic-rg35xx-h-rev6-panel.dtb
default pingo
timeout 0

label pingo
  kernel /Image
  fdt /dtbs/sun50i-h700-anbernic-rg35xx-h.dtb
  append root=PARTUUID=50494e47-02 rootfstype=squashfs ro rootwait console=ttyS0,115200 console=tty1 loglevel=4 consoleblank=0
