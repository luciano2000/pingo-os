# Pingo OS by Retrogamer Brasil - RG40XX-H
# Unidades com o painel "v2" (fabricadas mais recentemente): troque a linha fdt por
#   fdt /dtbs/sun50i-h700-anbernic-rg40xx-h-v2-panel.dtb
default pingo
timeout 0

label pingo
  kernel /Image
  fdt /dtbs/sun50i-h700-anbernic-rg40xx-h.dtb
  append root=PARTUUID=50494e47-02 rootfstype=squashfs ro rootwait console=tty1 console=ttyS0,115200 loglevel=3 consoleblank=0 logo.nologo vt.global_cursor_default=0
