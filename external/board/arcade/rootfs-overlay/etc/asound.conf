# Pingo Arcade: o PCM5102A estala quando o I2S liga e desliga. Tudo passa
# pelo dmix e o pingo-som mantém um fluxo de silêncio aberto, então o
# relógio nunca para entre a galeria e os jogos.
pcm.!default {
	type plug
	slave.pcm "mistura"
}
pcm.mistura {
	type dmix
	ipc_key 5102
	ipc_perm 0666
	slave {
		pcm "hw:sndrpihifiberry"
		rate 48000
		format S16_LE
		channels 2
		period_size 512
		buffer_size 2048
	}
}
ctl.!default {
	type hw
	card sndrpihifiberry
}
