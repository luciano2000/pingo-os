# Pingo Arcade: imagem do cartão SD (MBR)
#   4M       p1 PINGOBOOT (FAT32): firmware, kernel, device tree, config.txt
#   68M      p2 sistema (squashfs, somente leitura)
#   (resto)  p3 ROMS (exFAT), criada e formatada no primeiro boot

image boot.vfat {
	vfat {
		label = "PINGOBOOT"
		files = {
#BOOT_FILES#
		}
	}
	size = 64M
}

image pingo-arcade-rpi3.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x50494e47
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		offset = 4M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}
}
